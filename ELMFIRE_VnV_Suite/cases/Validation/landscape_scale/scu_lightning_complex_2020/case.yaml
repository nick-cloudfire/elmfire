      TIME_CONTROL.TARGET_CFL: 0.2
      TIME_CONTROL.SIMULATION_TSTOP: 1249200.0
      MONTE_CARLO.NUM_METEOROLOGY_TIMES: 348
      SIMULATOR.CROWN_FIRE_MODEL: 1
